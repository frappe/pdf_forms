---
name: Feature Request
description: Suggest an idea to improve PDF Forms
labels: ["feature-request"]

body:
  - type: markdown
    attributes:
      value: |
        Before submitting a request, please consider the following:

        1. This tracker is for bugs and feature requests for PDF Forms.
            - For questions and general support, use the [forum](https://discuss.frappe.io).
        2. Use the search function before creating a new issue. Duplicates will be closed and directed to the original discussion.
        3. Be as specific as you can. A sample PDF and a description of the data you want on it convey more than a paragraph.

  - type: textarea
    id: problem-info
    attributes:
      label: Is your feature request related to a problem? Please describe.
      description: A clear and concise description of what the problem is. Eg. I'm always frustrated when [...]
      placeholder: Please provide as much information as possible.

  - type: textarea
    id: solution-info
    attributes:
      label: Describe the solution you'd like
      description: A clear and concise description of what you want to happen.

  - type: textarea
    id: alternatives-info
    attributes:
      label: Describe the alternatives you've considered
      description: A clear and concise description of any alternative solutions or features you've considered.

  - type: textarea
    id: additional-info
    attributes:
      label: Additional context
      description: Add any other context, sample PDFs or screenshots about the feature request here.
...
