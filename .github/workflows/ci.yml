name: CI

on:
  push:
    branches:
      - develop
  pull_request:
    paths-ignore:
      - "**.md"
      - "**.csv"
      - "**.po"
      - "**.pot"
      - "docs/**"
  schedule:
    # every day at midnight UTC
    - cron: "0 0 * * *"
  workflow_dispatch:
    inputs:
      frappe_branch:
        description: Frappe branch to test against
        default: version-15

concurrency:
  group: ci-${{ github.event.number || github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Server Tests
    runs-on: ubuntu-latest
    timeout-minutes: 60

    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']

    services:
      mariadb:
        image: mariadb:11.8
        env:
          MARIADB_ROOT_PASSWORD: 'root'
        ports:
          - 3306:3306
        options: --health-cmd="mariadb-admin ping" --health-interval=5s --health-timeout=2s --health-retries=3

    steps:
      - name: Clone
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Check for valid Python & merge conflicts
        run: |
          python -m compileall -f "${GITHUB_WORKSPACE}/pdf_forms"
          if grep -lr --exclude-dir=node_modules "^<<<<<<< " "${GITHUB_WORKSPACE}"
              then echo "Found merge conflicts"
              exit 1
          fi

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 20
          check-latest: true

      - name: Add to hosts
        run: echo "127.0.0.1 test_site" | sudo tee -a /etc/hosts

      - name: Cache pip
        uses: actions/cache@v6
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/*requirements.txt', '**/pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-pip-
            ${{ runner.os }}-

      - name: Get yarn cache directory path
        id: yarn-cache-dir-path
        run: echo "dir=$(yarn cache dir)" >> $GITHUB_OUTPUT

      - uses: actions/cache@v6
        id: yarn-cache
        with:
          path: ${{ steps.yarn-cache-dir-path.outputs.dir }}
          key: ${{ runner.os }}-yarn-${{ hashFiles('**/yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-yarn-

      - name: Install
        run: bash ${GITHUB_WORKSPACE}/.github/helper/install.sh
        env:
          FRAPPE_BRANCH: ${{ github.event.inputs.frappe_branch }}

      - name: Build the workspace
        working-directory: /home/runner/frappe-bench
        run: CI=Yes bench build --app pdf_forms

      - name: Run tests
        working-directory: /home/runner/frappe-bench
        run: bench --site test_site run-tests --app pdf_forms
        env:
          TYPE: server

      - name: Run the app's own test runner
        # The same test classes through pdf_forms.tests.run, which does not
        # need Frappe's legacy test-record preload.
        working-directory: /home/runner/frappe-bench
        run: bench --site test_site execute pdf_forms.tests.run.main

      - name: Show bench log on failure
        if: failure()
        run: tail -n 200 /home/runner/frappe-bench/bench_start.log || true
