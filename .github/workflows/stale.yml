# https://github.com/actions/stale
name: "Close Stale PRs"
on:
  schedule:
    - cron: 0 0 * * *
  workflow_dispatch:

permissions:
  issues: write
  pull-requests: write

jobs:
  stale:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/stale@v9
        with:
          days-before-pr-stale: 15
          days-before-pr-close: 3
          stale-pr-label: 'Inactive'
          exempt-draft-pr: true
          days-before-issue-stale: 5
          days-before-issue-close: 2
          stale-issue-label: 'Inactive'
          any-of-issue-labels: "question,can't replicate"
          remove-issue-stale-when-updated: true
          labels-to-remove-when-unstale: 'Inactive'
          stale-pr-message: |
            This pull request is being marked as inactive because of no recent activity.
            If your PR hasn't been reviewed, please make sure it is complete, has a clear description and passes CI, then ping a maintainer in a comment.

            It will be closed in 3 days if no further activity occurs.
            Thank you for contributing!
          stale-issue-message: |
            Hi, this is your friendly neighbourhood bot :)

            Thank you for taking the time to report the issue. The description is not enough for the maintainers to reproduce and fix it. Please add the information requested; steps, the PDF (or a redacted copy), screenshots and versions all help.

            It will be closed in 2 days if no further activity occurs.
            Beep Boop!
